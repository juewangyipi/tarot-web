<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarot Reading System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative&display=swap" rel="stylesheet">
    <style>
        body { background: radial-gradient(circle at center, #1a0033, #000000); }
        
        .card {
            width: 240px;
            height: 360px;
            perspective: 1200px;
            cursor: pointer;
        }
        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.9s cubic-bezier(0.23, 1, 0.32, 1);
            transform-style: preserve-3d;
            box-shadow: 0 25px 50px -12px rgb(0 0 0 / 0.6);
            border-radius: 20px;
        }
        .card.flipped .card-inner {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            position: absolute;
            inset: 0;
            border-radius: 20px;
            backface-visibility: hidden;
            overflow: hidden;
        }
        .card-front { transform: rotateY(180deg); }
        .card-back {
            background: linear-gradient(135deg, #1a0033, #4b0082);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 隐藏滚动条 */
        .scrollbar-hide {
            scrollbar-width: none;
        }
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body class="min-h-screen text-amber-100">
    <div class="max-w-6xl mx-auto px-6 py-12">
        
        <!-- 标题 -->
        <div class="text-center mb-12">
            <h1 class="text-7xl font-bold tracking-widest" style="font-family: 'Cinzel Decorative', cursive;">
                Tarot Reading System
            </h1>
            <p class="text-purple-300 mt-3 text-xl">Featuring 22 Major Arcana Cards</p>
            <div class="flex flex-wrap justify-center gap-4 mt-6">
                <a href="/" class="px-6 py-3 rounded-2xl border border-amber-400/50 bg-amber-500/10 hover:bg-amber-500/20 transition">
                    Start Reading
                </a>
                <a href="/meanings" class="px-6 py-3 rounded-2xl border border-purple-400/50 bg-purple-500/10 hover:bg-purple-500/20 transition">
                    Card Meanings
                </a>
            </div>
        </div>

        <!-- 控制面板 -->
        <div class="bg-zinc-900/80 border border-purple-800 rounded-3xl p-8 mb-12">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <!-- 问题类别 -->
                <div>
                    <label class="block text-sm text-purple-400 mb-2 min-h-[42px]">Question Category</label>
                    <select id="category" class="w-full bg-zinc-800 border border-purple-700 rounded-2xl px-4 py-3 text-lg">
                        <option value="general">General</option>
                        <option value="career">Career</option>
                        <option value="love">Love</option>
                        <option value="study">Study</option>
                    </select>
                </div>
		<!-- 牌阵 -->
                <div>
                    <label class="block text-sm text-purple-400 mb-2 min-h-[42px]">Spread</label>
                    <select id="spread" class="w-full bg-zinc-800 border border-purple-700 rounded-2xl px-4 py-3 text-lg">
                        <option value="1">Single Card</option>
                        <option value="3" selected>Three-Card Spread (Situation - Challenge - Advice)</option>
                    </select>
                </div>
		<!-- 数字输入 -->
                <div>
                    <label class="block text-sm text-purple-400 mb-2 min-h-[42px]">Enter Numbers (1-44, separated by space, leave blank for random)</label>
                    <input id="numbers" type="text" placeholder="e.g. 7 15 22" 
                           class="w-full bg-zinc-800 border border-purple-700 rounded-2xl px-4 py-3 text-lg">
                </div>
            </div>

            <div class="flex gap-4 mt-8">
                <button onclick="drawCards()" 
                        class="flex-1 py-4 bg-gradient-to-r from-purple-700 to-violet-800 hover:from-purple-600 hover:to-violet-700 rounded-2xl text-xl font-medium transition">
                    Start Reading
                </button>
                <button onclick="randomDraw()" 
                        class="flex-1 py-4 bg-gradient-to-r from-amber-700 to-orange-800 hover:from-amber-600 hover:to-orange-700 rounded-2xl text-xl font-medium transition">
                    Random Draw
                </button>
            </div>
        </div>

        <!-- 结果区域 -->
        <div id="result" class="hidden">
            <div class="text-center mb-10">
                <h2 class="text-4xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-amber-300 to-purple-300" id="main-theme"></h2>
                <p class="text-purple-300 mt-3 max-w-2xl mx-auto" id="summary"></p>
            </div>

            <!-- 卡牌展示区 -->
            <div id="cards-container" class="flex flex-wrap justify-center gap-8 mb-12"></div>

            <!-- 分数条 -->
            <div class="bg-zinc-900/80 border border-purple-800 rounded-3xl p-8 max-w-3xl mx-auto">
                <h3 class="text-xl text-center mb-6">Dimension Scores (0-10)</h3>
                <div id="scores-container" class="space-y-4"></div>
            </div>
        </div>
    </div>

    <script src="/static/js/main.js"></script>
</body>
</html>
